name: "Dotnet Repository Login"
description: "A GitHub Action that logs in to one or more .NET repositories for NuGet package publishing"
author: "Jimmie Fulton <jimmie@ybor.ai>"

# Define the inputs for this action
inputs:
  repository:
    description: "Repository name to configure"
    required: true
  repository-url:
    description: "Full repository URL (e.g., https://api.nuget.org/v3/index.json, https://mycompany.jfrog.io/artifactory/api/nuget/repo-name)"
    required: true
  username:
    description: "Username for repository authentication"
    required: true
  password:
    description: "Password/token for repository authentication"
    required: true

# Define the outputs for this action
outputs:
  configured-repository:
    description: "Name of successfully configured repository"
    value: ${{ steps.login.outputs.configured-repository }}

# Define the runs configuration
runs:
  using: "composite"
  steps:
    - name: Login to .NET repositories
      id: login
      shell: bash
      run: |
        set -e

        repo_name="${{ inputs.repository }}"
        repo_url="${{ inputs.repository-url }}"
        username="${{ inputs.username }}"
        password="${{ inputs.password }}"

        echo "Configuring repository: $repo_name"

        # Configure NuGet source
        dotnet nuget add source "$repo_url" --name "$repo_name" --username "$username" --password "$password" --store-password-in-clear-text

        echo "configured-repository=$repo_name" >> $GITHUB_OUTPUT
        echo "✓ Successfully configured repository: $repo_name at $repo_url"
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

# Define the branding for the action in the GitHub Marketplace
branding:
  icon: "award"
  color: "blue"
